# ═══════════════════════════════════════════════════════════════════
# GitHub Actions — Koru MsSql Yedek Release Workflow
# ═══════════════════════════════════════════════════════════════════
# Tetik: vX.Y.Z tag push
# Görev: SADECE GitHub Release oluştur (boş — asset'i Build-Release.ps1
#        içindeki "gh release upload" adımı yükler).
# Derleme/paketleme/yükleme LOCAL'de Build-Release.ps1 ile yapılır.
# ═══════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        ver="${{ github.ref_name }}"
        ver="${ver#v}"
        echo "VERSION=$ver" >> "$GITHUB_OUTPUT"

    - name: Extract changelog notes
      id: changelog
      shell: bash
      run: |
        ver="${{ steps.version.outputs.VERSION }}"
        notes=$(awk "/^## \[$ver\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -60)
        if [ -z "$notes" ]; then
          notes="Bkz: [CHANGELOG.md](https://github.com/hzkucuk/KoruMsSqlYedek/blob/master/CHANGELOG.md)"
        fi
        delim="NOTES_DELIM_$(uuidgen)"
        echo "NOTES<<$delim" >> "$GITHUB_OUTPUT"
        echo "$notes"        >> "$GITHUB_OUTPUT"
        echo "$delim"        >> "$GITHUB_OUTPUT"

    # Release'i DRAFT olarak oluştur — asset yoksa indirilemez
    # Build-Release.ps1 "gh release upload" ile exe'yi ekler ve draft'ı yayınlar
    - name: Create GitHub Release (draft)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}"
        draft: true
        prerelease: false
        body: |
          ## Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.NOTES }}

          ---
          ### Kurulum
          1. `KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe` indirin ve yönetici olarak çalıştırın
          2. Kurulum sihirbazını takip edin

          ### Gereksinimler
          - Windows 10/11 (x64)

          > Güncelleme yapıyorsanız mevcut ayarlarınız korunur.


name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:

    # ── Checkout (CHANGELOG okumak için) ──────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── Versiyon çıkar ────────────────────────────────────────────
    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        ver="${{ github.ref_name }}"
        ver="${ver#v}"
        echo "VERSION=$ver" >> "$GITHUB_OUTPUT"
        echo "Version: $ver"

    # ── Değişiklik notlarını çıkar ────────────────────────────────
    - name: Extract changelog notes
      id: changelog
      shell: bash
      run: |
        ver="${{ steps.version.outputs.VERSION }}"
        notes=$(awk "/^## \[$ver\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -60)
        if [ -z "$notes" ]; then
          notes="Bkz: [CHANGELOG.md](https://github.com/hzkucuk/KoruMsSqlYedek/blob/master/CHANGELOG.md)"
        fi
        delim="NOTES_DELIM_$(uuidgen)"
        echo "NOTES<<$delim" >> "$GITHUB_OUTPUT"
        echo "$notes"        >> "$GITHUB_OUTPUT"
        echo "$delim"        >> "$GITHUB_OUTPUT"

    # ── Setup.exe release asset olarak al ─────────────────────────
    # Local'de Build-Release.ps1 ile üretilen exe tag ile birlikte
    # push edilmiş olmalı (releases/ klasörü repo'da takip ediliyor).
    - name: Verify installer exists
      shell: bash
      run: |
        ver="${{ steps.version.outputs.VERSION }}"
        exe="releases/KoruMsSqlYedek_v${ver}_Setup.exe"
        if [ ! -f "$exe" ]; then
          echo "HATA: $exe bulunamadı. Build-Release.ps1 çalıştırılıp commit edildi mi?"
          exit 1
        fi
        size=$(du -sh "$exe" | cut -f1)
        echo "Installer bulundu: $exe ($size)"

    # ── GitHub Release oluştur + exe yükle ────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}"
        body: |
          ## Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.NOTES }}

          ---
          ### Kurulum
          1. `KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe` indirin ve yönetici olarak çalıştırın
          2. Kurulum sihirbazını takip edin

          ### Gereksinimler
          - Windows 10/11 (x64)

          > Güncelleme yapıyorsanız mevcut ayarlarınız korunur.
        draft: false
        prerelease: false
        files: |
          releases/KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe


name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'KoruMsSqlYedek.slnx'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:

    # ── Checkout ──────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── .NET SDK ──────────────────────────────────────────────────
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ── Versiyon çıkar ────────────────────────────────────────────
    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $ver = "${{ github.ref_name }}" -replace '^v', ''
        "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Version: $ver"

    # ── Restore + Build ───────────────────────────────────────────
    - name: Restore
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_FILE }} -c Release --no-restore

    # ── Test ──────────────────────────────────────────────────────
    - name: Test
      run: dotnet test ${{ env.SOLUTION_FILE }} -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      continue-on-error: true

    # ── Publish Win ───────────────────────────────────────────────
    - name: Publish Win
      run: dotnet publish KoruMsSqlYedek.Win\KoruMsSqlYedek.Win.csproj -c Release -o publish\win --self-contained false -p:PublishSingleFile=false

    # ── Publish Service ───────────────────────────────────────────
    - name: Publish Service
      run: dotnet publish KoruMsSqlYedek.Service\KoruMsSqlYedek.Service.csproj -c Release -o publish\service --self-contained false -p:PublishSingleFile=false

    # ── Output klasörünü hazırla ───────────────────────────────────
    # BUG FIX: releases/ Inno Setup'tan ÖNCE yaratılmalı;
    #          aksi hâlde compiler output yazamaz.
    - name: Prepare releases directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path releases | Out-Null

    # ── .NET Desktop Runtime İndir (installer'a gömülecek) ────────
    - name: Download .NET Desktop Runtime
      shell: pwsh
      run: |
        $redistDir = "Deployment\InnoSetup\redist"
        New-Item -ItemType Directory -Force -Path $redistDir | Out-Null
        $runtimeUrl = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/10.0.5/windowsdesktop-runtime-10.0.5-win-x64.exe"
        $runtimeFile = "$redistDir\windowsdesktop-runtime-10.0.5-win-x64.exe"
        Write-Host "Downloading .NET 10 Desktop Runtime..."
        Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeFile -UseBasicParsing
        if (!(Test-Path $runtimeFile)) { throw "Runtime download failed!" }
        $size = [math]::Round((Get-Item $runtimeFile).Length / 1MB, 1)
        Write-Host "Downloaded: $runtimeFile ($size MB)"

    # ── Inno Setup ────────────────────────────────────────────────
    # NOT: windows-latest runner'ında Inno Setup 6 pre-installed gelir.
    # choco install GEREKSİZ ve runner'daki kurulumla ÇAKİŞİYOR — kaldırıldı.

    - name: Compile Installer
      shell: pwsh
      run: |
        $ver    = "${{ steps.version.outputs.VERSION }}"
        $winDir = "${{ github.workspace }}\publish\win"
        $svcDir = "${{ github.workspace }}\publish\service"
        # Pre-installed path — GitHub windows-latest runner'da garântili mevcut
        $iscc   = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc `
            "/DMyAppVersion=$ver" `
            "/DWinPublishDir=$winDir" `
            "/DServicePublishDir=$svcDir" `
            "Deployment\InnoSetup\KoruMsSqlYedek.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

    # ── Değişiklik notlarını çıkar ────────────────────────────────
    # BUG FIX: Çok satırlı output için heredoc delimiter syntax kullan.
    - name: Extract changelog notes
      id: changelog
      shell: pwsh
      run: |
        $ver = "${{ steps.version.outputs.VERSION }}"
        $content = Get-Content CHANGELOG.md -Raw
        if ($content -match "(?s)## \[$ver\][^\n]*\n(.*?)(?=\n## \[|\z)") {
          $notes = $Matches[1].Trim()
        } else {
          $notes = "Bkz: [CHANGELOG.md](https://github.com/hzkucuk/KoruMsSqlYedek/blob/master/CHANGELOG.md)"
        }
        $delim = "NOTES_DELIM_$(New-Guid)"
        "NOTES<<$delim"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $notes           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "$delim"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # ── GitHub Release ────────────────────────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}"
        body: |
          ## Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.NOTES }}

          ---
          ### Kurulum
          1. `KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe` indirin ve yönetici olarak çalıştırın
          2. Kurulum sihirbazını takip edin

          ### Gereksinimler
          - Windows 10/11 (x64)
          - .NET 10 Desktop Runtime (installer'a dahildir, eksikse otomatik kurulur)

          > Güncelleme yapıyorsanız mevcut ayarlarınız korunur.
        draft: false
        prerelease: false
        files: |
          releases/KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe
