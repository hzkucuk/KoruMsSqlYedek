# ═══════════════════════════════════════════════════════════════════
# GitHub Actions — Koru MsSql Yedek Release Workflow
# ═══════════════════════════════════════════════════════════════════
# Tetik: vX.Y.Z tag push
# Görev: SADECE draft GitHub Release oluştur.
# Derleme/paketleme/yükleme LOCAL'de Build-Release.ps1 ile yapılır.
# Build-Release.ps1 "gh release upload" ile exe'yi yükler ve
# "gh release edit --draft=false" ile yayınlar.
# ═══════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        ver="${{ github.ref_name }}"
        ver="${ver#v}"
        echo "VERSION=$ver" >> "$GITHUB_OUTPUT"

    - name: Extract changelog notes
      id: changelog
      shell: bash
      run: |
        ver="${{ steps.version.outputs.VERSION }}"
        notes=$(awk "/^## \[$ver\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -60)
        if [ -z "$notes" ]; then
          notes="Bkz: [CHANGELOG.md](https://github.com/hzkucuk/KoruMsSqlYedek/blob/master/CHANGELOG.md)"
        fi
        delim="NOTES_DELIM_$(uuidgen)"
        echo "NOTES<<$delim" >> "$GITHUB_OUTPUT"
        echo "$notes"        >> "$GITHUB_OUTPUT"
        echo "$delim"        >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release (draft)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: "Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}"
        draft: true
        prerelease: false
        body: |
          ## Koru MsSql Yedek v${{ steps.version.outputs.VERSION }}

          ${{ steps.changelog.outputs.NOTES }}

          ---
          ### Kurulum
          1. `KoruMsSqlYedek_v${{ steps.version.outputs.VERSION }}_Setup.exe` indirin ve yönetici olarak çalıştırın
          2. Kurulum sihirbazını takip edin

          ### Gereksinimler
          - Windows 10/11 (x64)

          > Güncelleme yapıyorsanız mevcut ayarlarınız korunur.
